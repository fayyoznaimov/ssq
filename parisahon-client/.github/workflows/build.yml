name: Build and deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [ self-hosted, production ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build for production
        run: docker compose up -d --build

      - name: Cleanup
        run: docker system prune -f
