events { }

http {
    client_max_body_size 10M;

    # crm-hardening-2026-11-22: real client address behind traefik, login rate limit, http -> https for the CRM
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    limit_req_zone $binary_remote_addr zone=crm_login:10m rate=20r/m;
    map "$host|$http_x_forwarded_proto|$request_method" $crm_to_https {
        default 0;
        "crm.parisahome.com||GET" 1;
        "crm.parisahome.com||HEAD" 1;
        "crm.parisahome.com|http|GET" 1;
        "crm.parisahome.com|http|HEAD" 1;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name moarenhome.com www.moarenhome.com;

        location / {
            proxy_pass http://172.17.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }



    # Сайт parisahome.com: весь http уводим на https.
    # Нужно для старых ссылок и для поисковиков — до переезда из Бангалора
    # http-адреса вообще не отвечали, и накопленный вес ссылок никуда не шёл.
    server {
        listen 80;
        listen [::]:80;
        server_name parisahome.com www.parisahome.com;

        return 301 https://parisahome.com$request_uri;
    }

    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 80  default_server ;
	listen [::]:80 default_server;
        server_name _;
       

 # Uploaded files: served as files, never executed in the browser
        client_max_body_size 60M;

        # the API container gets a new address when it is recreated: look its name up each time
        resolver 127.0.0.11 valid=10s;
        set $crm_api http://crm2-app:3000;

        # crm-hardening-2026-11-22: browsers reach the CRM over https only; headers for every page and API answer
        if ($crm_to_https) {
            return 301 https://$host$request_uri;
        }
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # entry points of our own services (they call the API inside the docker network) and the bot's MCP
        location ~ ^/api/v1/(telegram/incoming|whatsapp/incoming|bot/mcp|calls/recorder)(/|$) {
            return 404;
        }

        # sign-in: at most 20 attempts a minute from one address (burst 20), then 429
        location = /api/v1/auth/login {
            limit_req zone=crm_login burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $crm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(api/v1/)?uploads/(?<upfile>.+)$ {
            alias /usr/share/nginx/html/uploads/$upfile;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "sandbox" always;
            if ($upfile ~* "\.(html?|xhtml|svg|xml|js|mjs|css)$") {
                add_header Content-Disposition "attachment" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Type "application/octet-stream" always;
            }
        }

        # Proxy to CRM API (new version, 2026-11-21)
        location /api/v1 {
            proxy_pass $crm_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /socket.io {
            proxy_pass $crm_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # The client is a single-page app: any address opens it
        location / {
            root /usr/share/nginx/html/client;
            index index.html;
            try_files $uri $uri/ /200.html;
        }
    }
}
