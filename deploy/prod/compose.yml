# New version of the CRM (2026-11-21), next to the old one in /root/crm. Same database (crm-db), same uploads.
# logs of every CRM container: 3 files of 20 MB at most
x-crm-logging: &crm-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  crm2-app:
    build:
      context: .
      dockerfile: api.Dockerfile
    image: crm2-api:ffmpeg
    container_name: crm2-app
    working_dir: /app
    command: node dist/main.js
    restart: unless-stopped
    logging: *crm-logging
    env_file: ./parisahon-api/.env
    volumes:
      - ./parisahon-api:/app
      - /root/crm/parisahon-api/public/uploads:/app/public/uploads
      # no /opt/ffmpeg or keys mounts (HACK-10): ffmpeg is the Debian one of the image (FFMPEG_BIN=/usr/bin/ffmpeg,
      # the same variable in telegram.env and whatsapp.env), SSL_KEY_PATH is read by nothing
      - ./claude:/opt/claude:ro
      - ./claude-home:/root/.claude
    networks: [crm-network]
  crm2-telegram:
    build: ./parisahon-telegram-service
    container_name: crm2-telegram
    restart: unless-stopped
    logging: *crm-logging
    env_file: ./telegram.env
    volumes:
      - ./tg-data:/data
      - /root/crm/parisahon-api/public/uploads:/app/uploads
    networks: [crm-network]
  crm2-whatsapp:
    # node 20 + ffmpeg from Debian (voice notes -> mp3, video thumbnails)
    image: crm2-api:ffmpeg
    container_name: crm2-whatsapp
    working_dir: /app
    command: node src/index.js
    restart: unless-stopped
    logging: *crm-logging
    env_file: ./whatsapp.env
    volumes:
      - ./parisahon-whatsapp-service:/app
      - ./wa-sessions:/data/sessions
      - /root/crm/parisahon-api/public/uploads:/app/uploads
    networks: [crm-network]
  crm2-stt:
    image: python:3.11-slim
    container_name: crm2-stt
    working_dir: /app
    command: /venv/bin/python -u /app/server.py
    restart: unless-stopped
    logging: *crm-logging
    mem_limit: 1800m
    environment:
      STT_HOST: 0.0.0.0
      STT_PORT: "8096"
      STT_MODEL: small
      STT_MODELS_DIR: /models
      STT_THREADS: "2"
      STT_LANGUAGES: ru,en
      STT_MIN_PROB: "0.8"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TZ: Asia/Tashkent
    volumes:
      - ./parisahon-stt:/app
      - ./stt-venv:/venv
      - ./stt-models:/models
    networks: [crm-network]
  crm2-ftp:
    image: python:3.11-slim
    container_name: crm2-ftp
    working_dir: /app
    command: /venv/bin/python -u /app/server.py
    restart: unless-stopped
    logging: *crm-logging
    env_file: ./ftp.env
    ports:
      - "2121:2121"
      - "21210-21219:21210-21219"
    volumes:
      - ./parisahon-ftp:/app
      - ./ftp-venv:/venv
      - ./ftp-data:/data
      # folders an old FTP server still fills (a phone not yet switched to port 2121): LEGACY_RECORDINGS_DIR in
      # the .env next to this file is that folder on the host (empty ./ftp-legacy when not set); which manager
      # each subfolder belongs to is FTP_EXTRA_HOMES in ftp.env, e.g. 47=/legacy/47 (parisahon-ftp/README.md)
      - ${LEGACY_RECORDINGS_DIR:-./ftp-legacy}:/legacy
    networks: [crm-network]
networks:
  crm-network:
    external: true
