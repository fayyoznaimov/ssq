events {

}

http {
    client_max_body_size 10M;

	server {
    	listen 80;
        server_name moarenhome.com www.moarenhome.com;
	listen [::]:80;
        location / {
        proxy_pass http://172.17.0.1:8081;
       	proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	    }
	}

 	server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 443 ssl;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Additional SSL configurations (optional)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Serve static files
        location /api/v1/uploads {
            if ($http_user_agent ~* "Go-http-client") {
                return 403;
            }
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files /$uri /html/$uri/ =404;
        }

        # Proxy to crm api
        location /api/v1 {
            if ($http_user_agent ~* "Go-http-client") {
                return 403;
            }
            proxy_pass http://crm-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        location /socket.io {
            proxy_pass http://crm-app:3000/socket.io/;  # FIXED proxy_pass
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent buffering (Fixes WebSocket issues)
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Serve client-app
        location / {
            if ($http_user_agent ~* "Go-http-client") {
                return 403;
            }
            root /usr/share/nginx/html/client;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
