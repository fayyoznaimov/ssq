events { }

http {
    client_max_body_size 10M;

    server {
        listen 80;
        listen [::]:80;
        server_name moarenhome.com www.moarenhome.com;

        location / {
            proxy_pass http://172.17.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }



    # Сайт parisahome.com: весь http уводим на https.
    # Нужно для старых ссылок и для поисковиков — до переезда из Бангалора
    # http-адреса вообще не отвечали, и накопленный вес ссылок никуда не шёл.
    server {
        listen 80;
        listen [::]:80;
        server_name parisahome.com www.parisahome.com;

        return 301 https://parisahome.com$request_uri;
    }

    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 80  default_server ;
	listen [::]:80 default_server;
        server_name _;
       

 # Serve static files
        location /uploads {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files /$uri /html/$uri/ =404;
        }

        # Proxy to CRM API
        location /api/v1 {
            proxy_pass http://crm-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ✅ Correct WebSocket proxy settings
        location /socket.io {
            proxy_pass http://crm-app:3000/socket.io/;  # FIXED proxy_pass
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent buffering (Fixes WebSocket issues)
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Serve client-app (Avoid redirecting WebSockets to index.html)
        location / {
            root /usr/share/nginx/html/client;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }
    }
}
