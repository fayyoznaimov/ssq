# Local copy of the prod routing (parisahon-api/docker/nginx/nginx.dev.conf), without TLS.
events { }
http {
    include mime.types;
    client_max_body_size 10M;

    # Docker DNS: re-resolve crm-app so nginx survives API container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        set $api http://crm-app:3000;

        location /api/v1/uploads {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /api/v1 {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /socket.io {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
